<style>
.btn {
  display: inline-block;
  padding: 10px 20px;
  background: #007bff;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  transition: background 0.3s;
}

.btn:hover {
  background: #0069d9;
}

.photo-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  grid-auto-rows: 150px;
  grid-auto-flow: dense;
  gap: 10px;
  margin-top: 30px;
}

.photo-gallery img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 0;
  transition: all 0.3s ease;
  background: #f8f9fa;
  cursor: pointer;
}

.photo-gallery img:hover {
  object-fit: contain;
  transform: scale(1.15);
}

/* 随机设置不同照片的大小，创建多样化布局 */
.photo-gallery img:nth-child(4n) {
  grid-column: span 2;
  grid-row: span 2;
}

.photo-gallery img:nth-child(5n) {
  grid-column: span 1;
  grid-row: span 2;
}

.photo-gallery img:nth-child(7n) {
  grid-column: span 2;
  grid-row: span 1;
}

.photo-gallery img:nth-child(9n) {
  grid-column: span 1;
  grid-row: span 1;
}

.photo-gallery img:nth-child(11n) {
  grid-column: span 3;
  grid-row: span 2;
}

.photo-gallery img:nth-child(13n) {
  grid-column: span 2;
  grid-row: span 3;
}

/* 模态框样式 */
.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(0,0,0,0.9);
}

.modal-content {
  margin: auto;
  display: block;
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
}

.close {
  position: absolute;
  top: 20px;
  right: 30px;
  color: #f1f1f1;
  font-size: 40px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

.close:hover {
  color: #bbb;
}
</style>

<script>
// 打开模态框
function openModal(src) {
  var modal = document.getElementById("imageModal");
  var modalImg = document.getElementById("modalImage");
  modal.style.display = "flex";
  modalImg.src = src;
}

// 关闭模态框
function closeModal() {
  var modal = document.getElementById("imageModal");
  modal.style.display = "none";
}

// 点击模态框外部关闭
window.onclick = function(event) {
  var modal = document.getElementById("imageModal");
  if (event.target == modal) {
    modal.style.display = "none";
  }
}
</script>
