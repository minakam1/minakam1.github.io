<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>mimi. / 光影集</title>
  <meta name="description" content="mimi 的照片信息流。" />
  <meta name="theme-color" content="#f1e6cf" />
  <link rel="preconnect" href="https://fonts.loli.net" crossorigin />
  <link href="https://fonts.loli.net/css2?family=Press+Start+2P&family=VT323&family=DM+Serif+Display:ital@0;1&family=ZCOOL+XiaoWei&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="./gallery.css?v=3" />
</head>
<body>
  <div class="texture texture--grain" aria-hidden="true"></div>
  <div class="texture texture--scan" aria-hidden="true"></div>

  <header class="statusbar">
    <div class="statusbar__group"><span class="statusbar__dot"></span><span>REC</span><span class="dim">·</span><span>LIGHT ARCHIVE</span></div>
    <div class="statusbar__group"><span id="clock">--:--:--</span><span class="dim">·</span><a class="statusbar__button" href="../">← HOME</a><button class="statusbar__button" id="themeBtn" type="button" aria-label="切换纸张">▣</button></div>
  </header>

  <div class="marquee" aria-hidden="true">
    <div class="marquee__track"><span>✦ LIGHT ARCHIVE ✦ PHOTO STREAM ✦ 点击照片查看原图 ✦ 1–6 切换纸张 ✦ </span><span>✦ LIGHT ARCHIVE ✦ PHOTO STREAM ✦ 点击照片查看原图 ✦ 1–6 切换纸张 ✦ </span></div>
  </div>

  <main>
    <section class="masthead">
      <div class="masthead__kicker">/ PHOTO STREAM /</div>
      <div class="masthead__line">
        <h1>光影集</h1>
        <div class="masthead__stamp" aria-hidden="true">MIMI<br />LIGHT<br />ARCHIVE</div>
      </div>
      <div class="masthead__meta"><span id="photoCount">— PHOTOS</span><span>SCROLL TO VIEW</span></div>
    </section>

    <section class="photo-stream" id="photoStream" aria-label="全部照片" aria-live="polite"></section>
    <p class="load-state" id="loadState">正在读取照片…</p>
  </main>

  <footer><span>LIGHT ARCHIVE</span><a href="../">← 返回主页</a></footer>

  <dialog class="viewer" id="viewer" aria-label="照片预览">
    <button class="viewer__close" id="closeViewer" type="button" aria-label="关闭">×</button>
    <button class="viewer__nav" id="prevPhoto" type="button" aria-label="上一张">←</button>
    <figure><img id="viewerImage" alt="" /></figure>
    <button class="viewer__nav" id="nextPhoto" type="button" aria-label="下一张">→</button>
  </dialog>

  <template id="photoTemplate">
    <article class="photo-card">
      <button type="button"><img alt="" loading="lazy" decoding="async" /></button>
    </article>
  </template>
  <script src="./gallery.js?v=3"></script>
</body>
</html>
