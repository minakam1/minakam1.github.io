<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mimi. / sounds</title>
  <meta name="description" content="听 · mimi. 录下的声音" />
  <link rel="preconnect" href="https://fonts.loli.net" crossorigin />
  <link href="https://fonts.loli.net/css2?family=Press+Start+2P&family=VT323&family=DM+Serif+Display:ital@0;1&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="./subpage.css?v=1" />
</head>
<body>
  <div class="overlay overlay--halftone"></div>
  <div class="overlay overlay--grain"></div>
  <div class="overlay overlay--scanlines"></div>
  <div class="overlay overlay--vignette"></div>
  <div class="cursor" id="cursor"><span class="cursor__cross"></span></div>

  <header class="statusbar">
    <div class="statusbar__left">
      <span class="statusbar__dot"></span>
      <span>REC</span>
      <span class="statusbar__sep">·</span>
      <span>SOUNDS</span>
      <span class="statusbar__sep">·</span>
      <span>ISSUE NO.001</span>
    </div>
    <div class="statusbar__right">
      <span id="clock">--:--:--</span>
      <span class="statusbar__sep">·</span>
      <a class="statusbar__btn" href="./index.html">← home</a>
      <button class="statusbar__btn" id="themeBtn" type="button">▣</button>
    </div>
  </header>

  <main class="main">
    <a class="back" href="./index.html">← 返回主页</a>
    <h1 class="h">听</h1>
    <p class="sub">// SOUNDS · 12 段田野录音</p>
    <div class="divider"></div>
    
      <div class="track"><span class="no">01</span><span>雨夜 · 4:00</span><span class="dur">02:14</span></div>
      <div class="track"><span class="no">02</span><span>菜市场 · 早市</span><span class="dur">08:42</span></div>
      <div class="track"><span class="no">03</span><span>服务器机房 · 凌晨</span><span class="dur">15:00</span></div>
      <div class="track"><span class="no">04</span><span>旧电视 · 白噪音</span><span class="dur">03:33</span></div>
      <div class="track"><span class="no">05</span><span>海 · 阴天</span><span class="dur">07:18</span></div>
      <div class="track"><span class="no">06</span><span>打字机 · 老式</span><span class="dur">04:09</span></div>
      <div class="track"><span class="no">07</span><span>翻书 · 秋天</span><span class="dur">06:25</span></div>
      <div class="track"><span class="no">08</span><span>打字机的诗</span><span class="dur">01:11</span></div>
      <p style="text-align:center;font-family:'VT323',monospace;color:var(--muted);font-size:13px;margin-top:24px;">— 实际播放需补音频文件 —</p>
    
  </main>

  <footer class="colophon">
    <span>© mimi. / mmxxvi</span>
    <span>sounds · printed on the internet</span>
  </footer>

  <script>
  (() => {
    const THEMES = ['paper','ink','snow','copper'];
    const LABELS = {paper:'米色',ink:'夜墨',snow:'雪',copper:'铜版'};
    const STORAGE = 'mimi.theme';
    function apply(n){
      if (!THEMES.includes(n)) n='paper';
      document.documentElement.setAttribute('data-theme', n);
      const b=document.getElementById('themeBtn');
      if(b) b.title='纸张: '+LABELS[n];
      try{localStorage.setItem(STORAGE,n);}catch(e){}
    }
    let saved='paper';
    try{saved=localStorage.getItem(STORAGE)||'paper';}catch(e){}
    apply(saved);
    document.getElementById('themeBtn').addEventListener('click',()=>{
      const cur=document.documentElement.getAttribute('data-theme')||'paper';
      apply(THEMES[(THEMES.indexOf(cur)+1)%THEMES.length]);
    });
    document.addEventListener('keydown',(e)=>{
      if(e.key>='1'&&e.key<='4'){apply(THEMES[+e.key-1]);}
    });

    const c=document.getElementById('clock');
    if(c){
      const t=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');c.textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());};
      t();setInterval(t,1000);
    }

    const cur=document.getElementById('cursor');
    if(cur && !matchMedia('(hover: none)').matches){
      let tx=innerWidth/2,ty=innerHeight/2,cx=tx,cy=ty;
      addEventListener('mousemove',e=>{tx=e.clientX;ty=e.clientY;});
      const loop=()=>{cx+=(tx-cx)*0.55;cy+=(ty-cy)*0.55;cur.style.transform='translate('+cx+'px,'+cy+'px) translate(-50%,-50%)';requestAnimationFrame(loop);};
      loop();
      addEventListener('mouseleave',()=>cur.style.opacity='0');
      addEventListener('mouseenter',()=>cur.style.opacity='1');
    }
  })();
  </script>
</body>
</html>
